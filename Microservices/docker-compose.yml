services:
  user-service:
    build:
      context: ./user-service
    container_name: user-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-","http://localhost:3000/users"]
      interval: 30s
      timeout: 10s
      retries: 3

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-","http://localhost:3001/products"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-","http://localhost:3002/orders"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-","http://localhost:3003/api/users"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      USER_SERVICE_URL: http://user-service:3000
      PRODUCT_SERVICE_URL: http://product-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
    depends_on:
      - user-service
      - product-service
      - order-service
